<!doctype html>
<html lang="en" style="background-color: #030712; color: #f1f5f9; min-height: 100vh;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SHADOW AI - Futuristic Android Assistant</title>
    <meta name="description" content="Premium futuristic Android AI assistant with Kotlin & Jetpack Compose, Hindi & English voice interaction, safe Android Intents, photo and video vision analysis, and real project export." />
    <meta property="og:title" content="SHADOW AI - Futuristic Android Assistant" />
    <meta property="og:description" content="Premium futuristic Android AI assistant with Kotlin & Jetpack Compose, Hindi & English voice interaction, safe Android Intents, photo and video vision analysis, and real project export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shadow AI" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[Shadow PWA] SW registration notice:', err);
          });
        });
      }
    </script>
    <style>
      html, body {
        background-color: #030712 !important;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }
      @keyframes shadow-init-bar {
        0% { left: -50%; width: 30%; }
        50% { left: 25%; width: 50%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body class="bg-black text-slate-100 antialiased selection:bg-purple-600 selection:text-white overflow-x-hidden" style="background-color: #030712; color: #f1f5f9; min-height: 100vh;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #030712; color: #f8fafc; font-family: 'Chakra Petch', system-ui, sans-serif; text-align: center; padding: 1.5rem;">
        <div style="position: relative; width: 68px; height: 68px; margin-bottom: 1.25rem;">
          <div style="position: absolute; inset: 0; border-radius: 1.25rem; background: linear-gradient(135deg, #06b6d4, #a855f7); filter: blur(14px); opacity: 0.6;"></div>
          <div style="position: relative; width: 100%; height: 100%; border-radius: 1.25rem; background: #070b19; border: 1.5px solid rgba(6,182,212,0.6); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #38bdf8; box-shadow: 0 0 20px rgba(6,182,212,0.3);">
            S
          </div>
        </div>
        <h1 style="font-size: 1.2rem; font-weight: 700; letter-spacing: 0.15em; margin: 0 0 0.4rem 0; background: linear-gradient(90deg, #38bdf8, #c084fc, #ffffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          SHADOW AI
        </h1>
        <p style="font-size: 0.75rem; color: #94a3b8; font-family: monospace; margin: 0 0 1.25rem 0; letter-spacing: 0.05em;">
          INITIALIZING ASSISTANT ENGINE...
        </p>
        <div style="width: 140px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #06b6d4, #a855f7); border-radius: 9999px; animation: shadow-init-bar 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
