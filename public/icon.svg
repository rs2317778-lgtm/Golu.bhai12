<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="url(#cyberNeon)" stroke-width="6" opacity="0.6" />

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="24 16" opacity="0.5" />

  <!-- Center Shadow 'S' Crest with Glow -->
  <g filter="url(#glow)">
    <!-- Stylized Futuristic 'S' -->
    <path d="M 320 160 C 320 160 210 160 190 200 C 170 240 230 250 290 270 C 350 290 350 340 310 370 C 270 400 170 380 170 380" 
          fill="none" 
          stroke="url(#cyberNeon)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Core Cyber Node Dots -->
    <circle cx="190" cy="200" r="12" fill="#06b6d4" />
    <circle cx="310" cy="370" r="12" fill="#a855f7" />
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
  </g>
</svg>
